[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spark-sense-ai"
version = "0.1.3"
description = "MCP server for diagnosing Apache Spark job failures and suggesting performance optimizations - source-agnostic (EMR or local) and LLM-provider-agnostic (Bedrock, Anthropic, OpenAI, or let the calling agent reason)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sunny Singh Thakur" }
]
keywords = ["mcp", "spark", "apache-spark", "bedrock", "claude", "ai", "data-engineering", "genai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.10.0,<2.0.0"
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0"]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
all = ["boto3>=1.34.0", "anthropic>=0.40.0", "openai>=1.50.0"]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/spark-sense-ai"
Repository = "https://github.com/YOUR_GITHUB_USERNAME/spark-sense-ai"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/spark-sense-ai/issues"

[project.scripts]
sparksense-mcp = "sparksense_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sparksense_mcp"]
